[package]
name = "triage_agent"
version = "0.1.0"
edition = "2021"
description = "Autonomous Policy Triage & Candidate Rule Synthesis Agent for Marketplace Trust Gateway"

[dependencies]
# Trust Gateway SDK (Kernel Models)
trust-sdk = { path = "../marketplace_trust_gateway/public/crates/trust-sdk" }

# Networking & Web Server
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["trace", "cors"] }
reqwest = { version = "0.12", features = ["json"] }

# Serialization & Config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dotenvy = "0.15"
clap = { version = "4.5", features = ["derive"] }

# Logging & Telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Utilities
anyhow = "1.0"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
sha2 = "0.10"
